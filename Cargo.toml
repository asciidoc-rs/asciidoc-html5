[workspace]
members = ["cli", "html5", "sdd"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asciidoc-rs/asciidoc-html5"
# Minimum supported Rust version, matching asciidoc-parser and verified in CI.
rust-version = "1.88.0"
version = "0.1.8"

[workspace.dependencies]
# TEMPORARY — remove before merging to main: track the parser's `inline-ast`
# feature branch (asciidoc-rs/asciidoc-parser#1059) until it merges and ships in
# a release, then return to a plain crates.io version. The `version` key keeps
# cargo-deny's wildcard ban satisfied while the `git` source is in effect.
# (Currently pinned to the branch of asciidoc-rs/asciidoc-parser#1334 — the
# inline-ast performance fix — so CI benchmarks measure it; move back to
# `branch = "inline-ast"` once that PR merges.)
asciidoc-parser = { version = "0.30.0", git = "https://github.com/asciidoc-rs/asciidoc-parser", branch = "perf-inline-builder-regex-hot-path" }
scraper = "0.27"

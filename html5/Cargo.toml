[package]
categories = ["text-processing"]
description = "HTML5 renderer for AsciiDoc, compatible with Asciidoctor's html5 backend"
edition.workspace = true
keywords = ["asciidoc", "html5", "converter", "renderer"]
license.workspace = true
name = "asciidoc-html5"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
asciidoc-parser.workspace = true

[dev-dependencies]
codspeed-criterion-compat = "5.0.1"
criterion = "0.8.2"
scraper.workspace = true

[[bench]]
harness = false
name = "render_micro"

[[bench]]
harness = false
name = "render_scaling"

[[bench]]
harness = false
name = "convert_pipeline"

[[bench]]
harness = false
name = "bulk_conversion"

# The benches use `codspeed-criterion-compat`; `criterion` is pulled in for
# local `cargo bench` runs, so cargo-udeps can't see it used directly.
[package.metadata.cargo-udeps.ignore]
development = ["criterion"]

[package]
categories = ["text-processing"]
description = "HTML5 renderer for AsciiDoc, compatible with Asciidoctor's html5 backend"
edition.workspace = true
keywords = ["asciidoc", "html5", "converter", "renderer"]
license.workspace = true
name = "asciidoc-html5"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
asciidoc-parser.workspace = true

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5.0.1" }
scraper.workspace = true

[[bench]]
harness = false
name = "convert"
# `cargo test` would otherwise build and run the benchmark harness as a test,
# which the coverage and minimum-version jobs have no reason to do.
test = false
